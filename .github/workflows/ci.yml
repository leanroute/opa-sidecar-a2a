name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    name: Build + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true

      - name: Verify go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: gofmt
        run: |
          fmt_diff=$(gofmt -s -l .)
          if [ -n "$fmt_diff" ]; then
            echo "gofmt found issues in:"
            echo "$fmt_diff"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: Build
        run: make build

      - name: Test (race)
        run: go test -race -count=1 -coverprofile=coverage.txt ./...

      - name: Coverage
        run: go tool cover -func=coverage.txt | tail -1

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true
      - uses: golangci/golangci-lint-action@v6
        with:
          version: latest

  rego-check:
    name: Rego policy syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install OPA
        run: |
          curl -L -o opa https://openpolicyagent.org/downloads/latest/opa_linux_amd64_static
          chmod +x opa
          sudo mv opa /usr/local/bin/opa
      - name: Check reference policies parse + typecheck
        run: |
          opa check policies/
      - name: Optional — evaluate example inputs (add fixtures under tests/rego/ to enable)
        run: |
          if [ -d tests/rego ]; then
            opa test policies/ tests/rego/
          else
            echo "no rego test fixtures; skipping"
          fi
